<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raja AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 17px;
  background: #131b30;
  border-bottom: 1px solid #26334d;
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {ť
  width: 43px;
  height: 43px;
  border-radius: 14px;
  background: linear-gradient(135deg,#00d9ff,#655cff);
  display: grid;
  place-items: center;
  font-size: 23px;
}

header h2 {
  margin: 0;
  font-size: 20px;
}

header p {
  margin: 5px 0 0;
  font-size: 12px;
  color: #a8b6d3;
}

#status {
  margin-left: auto;
  font-size: 12px;
  color: #7df7b1;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.welcome {
  text-align: center;
  margin: 45px auto 25px;
  max-width: 350px;
}

.welcome .big {
  font-size: 48px;
}

.welcome h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.welcome p {
  color: #a8b6d3;
  line-height: 1.6;
}

.message {
  max-width: 850px;
  margin: 14px auto;
  padding: 13px 15px;
  border-radius: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #273c69;
  margin-left: auto;
  width: fit-content;
  max-width: 90%;
}

.ai {
  background: #151f33;
  border: 1px solid #26334d;
}

.label {
  display: block;
  color: #75ddff;
  font-size: 12px;
  margin-bottom: 6px;
}

#typing {
  text-align: center;
  color: #a8b6d3;
  padding: 5px;
}

footer {
  padding: 12px;
  background: #11192a;
  border-top: 1px solid #26334d;
}

form {
  max-width: 850px;
  margin: auto;
  display: flex;
  gap: 8px;
}

textarea {
  flex: 1;
  resize: none;
  min-height: 48px;
  max-height: 120px;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #34445f;
  background: #0b1020;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  border: none;
  cursor: pointer;
  border-radius: 12px;
  padding: 0 17px;
  font-size: 16px;
  font-weight: bold;
}

#send {
  background: #00c8ee;
  color: #07101e;
}

#clear {
  display: block;
  margin: 8px auto 0;
  background: transparent;
  color: #a8b6d3;
  font-size: 12px;
  padding: 6px;
}

button:disabled {
  opacity: 0.5;
}

@media (max-width: 480px) {
  #chat {
    padding: 12px;
  }

  .welcome {
    margin-top: 35px;
  }

  header {
    padding: 13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦</div>
  <div>
    <h2>Raja AI</h2>
    <p>आपका AI सहायक</p>
  </div>
  <span id="status">● तैयार</span>
</header>

<main id="chat">
  <section class="welcome" id="welcome">
    <div class="big">🤖</div>
    <h1>नमस्ते! मैं Raja AI हूँ</h1>
    <p>
      मुझसे कुछ भी पूछिए। मैं पढ़ाई, विज्ञान,
      तकनीक, लेखन और सामान्य ज्ञान में आपकी मदद कर सकता हूँ।
    </p>
  </section>
</main>

<div id="typing"></div>

<footer>
  <form id="form">
    <textarea
      id="input"
      placeholder="यहाँ अपना सवाल लिखें..."
      rows="1"
      aria-label="अपना सवाल लिखें"
      required
    ></textarea>
    <button id="send" type="submit">➤</button>
  </form>

  <button id="clear" type="button">नई बातचीत शुरू करें</button>
</footer>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const typing = document.getElementById("typing");
const statusText = document.getElementById("status");
const welcome = document.getElementById("welcome");

let history = [];

function addMessage(text, who) {
  const box = document.createElement("div");
  box.className = "message " + who;

  if (who === "ai") {
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "✦ Raja AI";
    box.appendChild(label);
  }

  const content = document.createElement("div");
  content.textContent = text;
  box.appendChild(content);

  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;

  return box;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const question = input.value.trim();
  if (!question || send.disabled) return;

  welcome?.remove();

  addMessage(question, "user");
  history.push({
    role: "user",
    content: question
  });

  input.value = "";
  send.disabled = true;
  statusText.textContent = "● सोच रहा हूँ...";
  typing.textContent = "Raja AI जवाब तैयार कर रहा है...";

  try {
    const response = await fetch(
      "https://YOUR-BACKEND-URL.onrender.com/api/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: history.slice(-20)
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "जवाब प्राप्त नहीं हुआ।");
    }

    if (!data.reply) {
      throw new Error("AI से खाली जवाब मिला।");
    }

    history.push({
      role: "assistant",
      content: data.reply
    });

    addMessage(data.reply, "ai");

  } catch (error) {
    history.pop();

    addMessage(
      "अभी जवाब नहीं मिल पाया। बैकएंड URL और सर्वर की सेटिंग जाँचें।\n\nविवरण: " +
      error.message,
      "ai"
    );
  } finally {
    typing.textContent = "";
    send.disabled = false;
    statusText.textContent = "● तैयार";
    input.focus();
  }
});

document.getElementById("clear").addEventListener("click", () => {
  history = [];
  chat.innerHTML = `
    <section class="welcome" id="welcome">
      <div class="big">🤖</div>
      <h1>नमस्ते! मैं Raja AI हूँ</h1>
      <p>मुझसे कुछ भी पूछिए। मैं आपकी मदद करने के लिए तैयार हूँ।</p>
    </section>
  `;
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>

</body>
</html>
